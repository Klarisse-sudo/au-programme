<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Au programme — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #0E0E0E;
    --bg-elevated: #161615;
    --bg-hover: #1E1E1D;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #F5F4EE;
    --text-dim: #B8B6AF;
    --text-muted: #6E6C66;
    --accent: #E8FF3B;
    --accent-dim: #C9DE21;
    --danger: #FF6B4A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button{ font-family: inherit; cursor:pointer; }
  a{ color: inherit; }

  .app{
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 28px 80px;
  }
  @media (max-width: 640px){ .app{ padding: 16px 16px 60px; } }

  /* ============ HEADER ============ */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 14px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .brand{
    display:flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand-mark{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand-mark span{ color: var(--accent); }
  .brand-sub{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .topbar-actions{ display:flex; gap:10px; }
  .btn-icon{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 999px;
    display:flex; align-items:center; justify-content:center;
    transition: all .15s ease;
  }
  .btn-icon:hover{ background: var(--bg-elevated); border-color: var(--border-strong); }
  .btn-icon svg{ width: 16px; height: 16px; }

  /* ============ FILTERS ============ */
  .filters{
    display:flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .filter-row{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .chip{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .12s ease;
    white-space: nowrap;
  }
  .chip:hover{ background: var(--bg-hover); border-color: var(--border-strong); }
  .chip.active{ background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip svg{ width: 13px; height: 13px; opacity: 0.7; }

  .filter-select-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  @media (max-width: 780px){ .filter-select-row{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px){ .filter-select-row{ grid-template-columns: 1fr; } }
  .filter-section-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 6px 2px -4px;
  }

  .select-field{
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    display:flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .select-field label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .select-field select,
  .select-field input{
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    outline: none;
    padding: 0;
    width: 100%;
    text-overflow: ellipsis;
  }
  .select-field select option{ background: var(--bg-elevated); color: var(--text); }

  .price-slider-field{
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .price-slider-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 6px;
  }
  .price-slider-header label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .price-slider-value{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }
  input[type="range"]{
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    height: 16px;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px;
  }
  input[type="range"]::-moz-range-track{
    height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
    margin-top: -6px;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }

  /* ============ RESULT BAR ============ */
  .result-bar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .result-bar strong{ color: var(--text); font-weight: 500; }
  .sort-btn{
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sort-btn:hover{ color: var(--text); }

  .fav-toggle{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .12s ease;
  }
  .fav-toggle:hover{ background: var(--bg-elevated); color: var(--text); }
  .fav-toggle.active{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  .fav-toggle:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .fav-toggle:disabled:hover{ background: transparent; color: var(--text-dim); }
  .fav-toggle svg{ width: 13px; height: 13px; }
  .result-bar-right{ display: flex; align-items: center; gap: 12px; }

  /* ============ GRID ============ */
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px 18px;
  }
  @media (max-width: 1080px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 780px){ .grid{ grid-template-columns: repeat(2, 1fr); gap: 20px 14px; } }
  @media (max-width: 440px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    background: transparent;
    cursor: pointer;
    display:flex; flex-direction:column;
    transition: transform .18s ease;
  }
  .card:hover{ transform: translateY(-2px); }
  .card:hover .card-poster::after{ opacity: 1; }

  .card-poster{
    aspect-ratio: 4 / 5;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    background: var(--bg-elevated);
    display:flex; align-items:center; justify-content:center;
    padding: 18px;
    text-align: center;
  }
  .card-poster::after{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    border-radius: 8px;
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
  }
  .card-poster-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 2.4vw, 26px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: #fff;
    mix-blend-mode: normal;
    text-transform: uppercase;
    hyphens: auto;
    word-break: break-word;
  }
  .card-poster-type-badge{
    position: absolute;
    top: 12px;
    left: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.75);
    background: rgba(255,255,255,0.85);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .card-fav{
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: none;
    display:flex; align-items:center; justify-content:center;
    color: #fff;
    opacity: 0;
    transition: opacity .15s ease, background .15s ease;
  }
  .card:hover .card-fav{ opacity: 1; }
  .card-fav:hover{ background: rgba(0,0,0,0.8); }
  .card-fav.on{ opacity: 1; color: var(--accent); }
  .card-fav svg{ width: 15px; height: 15px; }

  .card-body{ padding-top: 12px; }
  .card-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
    line-height: 1.25;
    color: var(--text);
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-date{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .card-venue{
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-price{
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Poster gradients per type */
  .g-danse{ background: linear-gradient(135deg, #B23A48 0%, #4B0E1D 100%); }
  .g-theatre{ background: linear-gradient(135deg, #234E52 0%, #0E1F22 100%); }
  .g-cinema{ background: linear-gradient(135deg, #2A2A2E 0%, #050505 100%); }
  .g-expo{ background: linear-gradient(135deg, #C88C4E 0%, #52341A 100%); }
  .g-musique{ background: linear-gradient(135deg, #3A2E7A 0%, #12082E 100%); }
  .g-conference{ background: linear-gradient(135deg, #4A5D3A 0%, #1E2814 100%); }
  .g-rencontre{ background: linear-gradient(135deg, #7A4A6E 0%, #2C1526 100%); }
  .g-festival{ background: linear-gradient(135deg, #D64B2E 0%, #6B1F0F 100%); }
  .g-performance{ background: linear-gradient(135deg, #666B7A 0%, #1C1F26 100%); }

  /* ============ EMPTY STATE ============ */
  .empty{
    grid-column: 1 / -1;
    text-align:center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .empty p{ font-size: 13px; }

  /* ============ DETAIL VIEW ============ */
  .detail{
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    overflow-y: auto;
    display: none;
  }
  .detail.open{ display: block; }
  .detail-inner{
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 28px 80px;
  }
  @media (max-width: 640px){ .detail-inner{ padding: 16px 16px 60px; } }

  .detail-nav{
    display:flex; justify-content: space-between; align-items: center;
    padding: 8px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .btn-back{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px 8px 10px;
    border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px;
    font-weight: 500;
    transition: all .12s ease;
  }
  .btn-back:hover{ background: var(--bg-elevated); border-color: var(--border-strong); }
  .btn-back svg{ width: 14px; height: 14px; }

  .detail-hero{
    aspect-ratio: 21 / 9;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: var(--bg-elevated);
    display:flex; align-items:center; justify-content:center;
    padding: 40px;
    margin-bottom: 28px;
  }
  @media (max-width: 640px){ .detail-hero{ aspect-ratio: 3 / 4; padding: 24px; } }
  .detail-hero-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 56px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: #fff;
    text-align: center;
    text-transform: uppercase;
  }

  .detail-header{
    margin-bottom: 24px;
  }
  .detail-type{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .detail-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--text);
    margin-bottom: 14px;
  }
  .detail-meta{
    display:flex;
    flex-wrap: wrap;
    gap: 14px 22px;
    padding: 16px 20px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .meta-item{ display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .meta-value{
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }
  .meta-value.price-free{ color: var(--accent); }

  .detail-actions{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .btn-primary, .btn-secondary{
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    transition: all .15s ease;
    text-decoration: none;
  }
  .btn-primary{
    background: var(--accent);
    color: var(--bg);
  }
  .btn-primary:hover{ background: var(--accent-dim); }
  .btn-secondary{
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover{ background: var(--bg-hover); border-color: var(--border-strong); }
  .btn-primary svg, .btn-secondary svg{ width: 15px; height: 15px; }

  .detail-section{
    margin-bottom: 28px;
  }
  .section-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .section-body{
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-dim);
    max-width: 68ch;
  }
  .section-body p{ margin-bottom: 12px; }
  .section-body p:last-child{ margin-bottom: 0; }

  .distribution{
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 8px 20px;
    font-size: 14px;
    max-width: 68ch;
  }
  @media (max-width: 560px){ .distribution{ grid-template-columns: 1fr; gap: 2px 0; } }
  .distribution dt{ color: var(--text-muted); }
  .distribution dd{ color: var(--text-dim); }
  @media (max-width: 560px){ .distribution dd{ margin-bottom: 10px; } }

  /* ============ AUTH GATE ============ */
  .auth-gate{
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-gate.hidden{ display: none; }
  .auth-box{
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .auth-brand{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .auth-brand span{ color: var(--accent); }
  .auth-sub{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 36px;
  }
  .auth-form{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .auth-form input{
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    text-align: center;
  }
  .auth-form input:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }
  .auth-submit{
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
  }
  .auth-submit:hover{ background: var(--accent-dim); }
  .auth-submit:disabled{ opacity: 0.5; cursor: not-allowed; }
  .auth-msg{
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .auth-msg.error{ color: var(--danger); }
  .auth-loading{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .user-badge{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .user-badge button{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
  }
  .user-badge button:hover{ color: var(--text); border-color: var(--border-strong); }

  /* ============ TOAST ============ */
  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 200;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body>

<!-- ============ AUTH GATE ============ -->
<div class="auth-gate" id="authGate">
  <div class="auth-box">
    <div class="auth-brand">Au <span>programme</span></div>
    <div class="auth-sub">Connexion par lien magique</div>

    <form class="auth-form" id="authForm">
      <input type="email" id="authEmail" placeholder="ton@email.com" required autocomplete="email">
      <button type="submit" class="auth-submit" id="authSubmit">Recevoir le lien de connexion</button>
    </form>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div class="app" id="mainView">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">Au <span>programme</span></div>
      <div class="brand-sub">Île-de-France</div>
    </div>
    <div class="topbar-actions">
      <span class="user-badge" id="userBadge"></span>
      <button class="btn-icon" id="btnSources" title="Gérer les sources">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>

  <div class="filters">
    <!-- Type chips -->
    <div class="filter-row" id="typeChips"></div>

    <!-- Geography row -->
    <div class="filter-section-label">Géographie</div>
    <div class="filter-select-row">
      <div class="select-field">

      cities = [...new Set(

        if(state.dept === '75'){
          const na = parseInt(a.replace(/\D/g, ''), 10) || 0;

          return na - nb;

        return a.localeCompare(b);

  function getFiltered(){

      if(state.favoritesOnly && !state.favorites.has(e.id)) return false;

      if(state.dept && e.department !== state.dept) return false;

      if(state.metro === 'yes' && !e.metroAccessible) return false;
      if(state.metro === 'no' && e.metroAccessible) return false;
      if(state.org && e.organizer !== state.org) return false;
      if(state.dateFrom && e.date && e.date < state.dateFrom) return false;
      if(state.priceMax <= 100 && (Number(e.price)||0) > state.priceMax) return false;
      return true;
    });
    list.sort((a,b)=>{
      if(state.sort === 'price') return (Number(a.price)||0) - (Number(b.price)||0);
      if(state.sort === 'title') return (a.title||'').localeCompare(b.title||'');
      return (a.date||'').localeCompare(b.date||'');

      const emptyMsg = state.favoritesOnly
        ? 'Aucun favori ne correspond aux autres filtres. Assouplis-les, ou clique à nouveau sur Favoris pour tout voir.'
        : 'Essaie d\'assouplir les filtres (type, géographie, prix) ou remets la date de départ plus tôt.';
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-title">Aucun événement ne correspond</div>
          <p>${emptyMsg}</p>
        </div>`;
      return;
    }

    list.forEach(e => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = e.id;
      const grad = TYPE_GRADIENT[e.type] || 'g-cinema';
      const isFav = state.favorites.has(e.id);
      card.innerHTML = `
        <div class="card-poster ${grad}">
          <span class="card-poster-type-badge">${escapeHtml(e.type)}</span>
          <div class="card-poster-title">${escapeHtml(shortenPosterTitle(e.title))}</div>
          <button class="card-fav ${isFav ? 'on' : ''}" data-fav="${e.id}" title="Favori">
            <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
            </svg>
          </button>
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(e.title)}</div>
          <div class="card-date">${escapeHtml(formatDate(e.date))}</div>
          <div class="card-venue">${escapeHtml(e.venue || '')}</div>
          <div class="card-price">${priceLabel(e.price)}</div>
        </div>
      `;
      card.addEventListener('click', (ev) => {
        if(ev.target.closest('[data-fav]')) return;
        openDetail(e.id);
      });
      grid.appendChild(card);
    });

    // Favorite handlers
    $$('[data-fav]').forEach(btn => {
      btn.addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        const id = btn.dataset.fav;
        const wasActive = state.favorites.has(id);
        const evt = state.events.find(x => x.id === id);

        // Optimistic UI update
        if(wasActive) state.favorites.delete(id); else state.favorites.add(id);
        renderGrid();

        if(evt && evt.fromSupabase && currentUser){
          try{
            if(wasActive){
              const { error } = await supabase.from('favorites').delete()
                .eq('user_id', currentUser.id).eq('event_id', id);
              if(error) throw error;
            } else {
              const { error } = await supabase.from('favorites').insert({
                user_id: currentUser.id, event_id: id
              });
              if(error) throw error;
            }
          } catch(err){
            // Revert on failure
            if(wasActive) state.favorites.add(id); else state.favorites.delete(id);
            renderGrid();
            showToast('Erreur de synchronisation des favoris');
          }
        }
        // For demo events (fromSupabase === false), the favorite stays local-only — no network call.
      });
    });
  }

  function shortenPosterTitle(t){
    if(!t) return '';
    // For the poster, we want a punchy chunk of the title
    if(t.length <= 42) return t;
    return t.substring(0, 40).replace(/\s+\S*$/, '') + '…';
  }

  // ---------- DETAIL VIEW ----------
  function openDetail(id){
    const e = state.events.find(x => x.id === id);
    if(!e) return;
    state.currentEventId = id;
    const grad = TYPE_GRADIENT[e.type] || 'g-cinema';
    const desc = (e.description || '')
      .split('\n\n')
      .map(p => `<p>${escapeHtml(p)}</p>`)
      .join('');
    const distEntries = Object.entries(e.distribution || {});
    const distHtml = distEntries.length
      ? `<dl class="distribution">${distEntries.map(([k,v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('')}</dl>`
      : '<p class="section-body">Distribution à venir.</p>';

    $('#detailInner').innerHTML = `
      <div class="detail-nav">
        <button class="btn-back" id="btnBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          Retour
        </button>
      </div>

      <div class="detail-hero ${grad}">
        <div class="detail-hero-title">${escapeHtml(e.title)}</div>
      </div>

      <div class="detail-header">
        <div class="detail-type">${escapeHtml(e.type)}</div>
        <h1 class="detail-title">${escapeHtml(e.title)}</h1>
      </div>

      <div class="detail-meta">
        <div class="meta-item">
          <span class="meta-label">Date</span>
          <span class="meta-value">${escapeHtml(formatDate(e.date, true))}${e.time ? ' — ' + escapeHtml(e.time) : ''}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Lieu</span>
          <span class="meta-value">${escapeHtml(e.venue || '—')}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Ville</span>
          <span class="meta-value">${escapeHtml(e.city || '—')}${e.metroAccessible ? ' <span style="color:var(--accent);font-family:JetBrains Mono, monospace;font-size:10px;letter-spacing:0.05em;">M</span>' : ''}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Département</span>
          <span class="meta-value">${escapeHtml(DEPTS[e.department] || '—')}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Organisateur</span>
          <span class="meta-value">${escapeHtml(e.organizer || '—')}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Prix</span>
          <span class="meta-value ${(Number(e.price)||0)===0 ? 'price-free' : ''}">${priceLabel(e.price)}</span>
        </div>
      </div>

      <div class="detail-actions">
        <button class="btn-primary" id="btnIcs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>
          Ajouter à mon agenda
        </button>
        ${e.link ? `<a class="btn-secondary" href="${escapeHtml(e.link)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
          Voir la page source
        </a>` : ''}
      </div>

      <div class="detail-section">
        <div class="section-label">Présentation</div>
        <div class="section-body">${desc || '<p>Description à venir.</p>'}</div>
      </div>

      <div class="detail-section">
        <div class="section-label">Distribution &amp; infos pratiques</div>
        ${distHtml}
      </div>
    `;

    $('#btnBack').addEventListener('click', closeDetail);
    $('#btnIcs').addEventListener('click', ()=> downloadIcs(e));

    $('#detailView').classList.add('open');
    $('#mainView').style.display = 'none';
    window.scrollTo(0,0);
  }

  function closeDetail(){
    $('#detailView').classList.remove('open');
    $('#mainView').style.display = '';
    state.currentEventId = null;
  }

  // ---------- ICS EXPORT ----------
  function downloadIcs(e){
    const dtstart = icsDate(e.date, e.time || '20:00');
    const dtend = icsDate(e.date, addHours(e.time || '20:00', 2));
    const uid = `${e.id}@au-programme`;
    const now = new Date();
    const dtstamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
    const desc = (e.description || '').replace(/\n/g, '\\n') + (e.link ? `\\n\\n${e.link}` : '');
    const location = [e.venue, e.city].filter(Boolean).join(', ');
    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//au-programme//FR',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtstamp}`,
      `DTSTART:${dtstart}`,
      `DTEND:${dtend}`,
      `SUMMARY:${escapeIcs(e.title)}`,
      `DESCRIPTION:${escapeIcs(desc)}`,
      `LOCATION:${escapeIcs(location)}`,
      e.link ? `URL:${e.link}` : '',
      'END:VEVENT',
      'END:VCALENDAR'
    ].filter(Boolean).join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slugify(e.title)}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Ajouté au fichier calendrier');
  }
  function icsDate(dateStr, timeStr){
    // dateStr = "YYYY-MM-DD", timeStr = "HH:MM" (Paris local -> stored without TZ for compatibility)
    const [Y,M,D] = dateStr.split('-');
    const [h,m] = (timeStr || '20:00').split(':');
    return `${Y}${M}${D}T${pad(h)}${pad(m)}00`;
  }
  function addHours(timeStr, hoursToAdd){
    const [h,m] = timeStr.split(':').map(Number);
    const total = h * 60 + m + hoursToAdd * 60;
    const nh = Math.floor(total / 60) % 24;
    const nm = total % 60;
    return `${pad(nh)}:${pad(nm)}`;
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function escapeIcs(s){ return String(s).replace(/([,;])/g, '\\$1'); }
  function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50) || 'event'; }

  // ---------- FILTER HANDLERS ----------
  $('#deptFilter').addEventListener('change', (e)=>{
    state.dept = e.target.value;
    // Reset city when dept changes — the list of cities depends on it
    state.city = '';
    buildCityFilter();
    renderGrid();
  });
  $('#cityFilter').addEventListener('change', (e)=>{ state.city = e.target.value; renderGrid(); });
  $('#metroFilter').addEventListener('change', (e)=>{ state.metro = e.target.value; renderGrid(); });
  $('#orgFilter').addEventListener('change', (e)=>{ state.org = e.target.value; renderGrid(); });
  $('#dateFilter').addEventListener('change', (e)=>{ state.dateFrom = e.target.value; renderGrid(); });
  $('#priceSlider').addEventListener('input', (e)=>{
    const v = parseInt(e.target.value, 10);
    state.priceMax = v;
    const label = v === 0 ? 'Gratuit uniquement'
                : v >= 101 ? 'Sans limite'
                : `${v} € max`;
    $('#priceValue').textContent = label;
    renderGrid();
  });
  $('#favToggle').addEventListener('click', ()=>{
    if(state.favorites.size === 0) return;
    state.favoritesOnly = !state.favoritesOnly;
    renderGrid();
  });
  $('#sortBtn').addEventListener('click', ()=>{
    const options = ['date','price','title'];
    const labels = { date: 'Par date', price: 'Par prix', title: 'A → Z' };
    const idx = options.indexOf(state.sort);
    state.sort = options[(idx + 1) % options.length];
    $('#sortLabel').textContent = labels[state.sort];
    renderGrid();
  });
  $('#btnSources').addEventListener('click', ()=>{
    showToast('Gestion des sources — bientôt');
  });

  // ---------- SUPABASE: LOAD EVENTS ----------
  async function loadEventsFromSupabase(){
    try{
      const { data, error } = await supabase
        .from('events')
        .select('*')
        .order('event_date', { ascending: true });
      if(error) throw error;
      if(data && data.length > 0){
        state.events = data.map(row => ({
          id: row.id,
          title: row.title,
          type: row.type,
          date: row.event_date,
          time: row.event_time,
          department: row.department,
          city: row.city,
          metroAccessible: !!row.metro_accessible,
          venue: row.venue,
          organizer: row.organizer,
          price: row.price,
          link: row.link,
          description: row.description,
          distribution: row.distribution || {},
          fromSupabase: true
        }));
        return;
      }
    } catch(err){
      console.error('Erreur de chargement des événements Supabase :', err);
    }
    // Fallback: no real events yet (table empty, or fetch failed) — show demo data
    state.events = [...SAMPLE_EVENTS];
  }

  // ---------- SUPABASE: LOAD FAVORITES ----------
  async function loadFavoritesFromSupabase(){
    if(!currentUser) return;
    try{
      const { data, error } = await supabase
        .from('favorites')
        .select('event_id')
        .eq('user_id', currentUser.id);
      if(error) throw error;
      (data || []).forEach(row => state.favorites.add(row.event_id));
    } catch(err){
      console.error('Erreur de chargement des favoris Supabase :', err);
    }
  }

  // ---------- AUTH ----------
  function showAuthGate(){ $('#authGate').classList.remove('hidden'); }
  function hideAuthGate(){ $('#authGate').classList.add('hidden'); }

  function renderUserBadge(){
    const badge = $('#userBadge');
    if(!currentUser){ badge.innerHTML = ''; return; }
    badge.innerHTML = `${escapeHtml(currentUser.email)} <button id="btnLogout">Déconnexion</button>`;
    $('#btnLogout').addEventListener('click', async ()=>{
      await supabase.auth.signOut();
      window.location.reload();
    });
  }

  async function startApp(){
    hideAuthGate();
    renderUserBadge();
    await loadEventsFromSupabase();
    await loadFavoritesFromSupabase();
    buildTypeChips();
    buildDynamicFilters();
    $('#dateFilter').value = todayIso;
    renderGrid();
  }

  $('#authForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const email = $('#authEmail').value.trim();
    const btn = $('#authSubmit');
    const msg = $('#authMsg');
    if(!email) return;
    btn.disabled = true;
    btn.textContent = 'Envoi en cours…';
    msg.textContent = '';
    msg.classList.remove('error');
    try{
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.href }
      });
      if(error) throw error;
      msg.textContent = `Lien envoyé à ${email} — ouvre ta boîte mail et clique sur le lien pour te connecter.`;
      btn.textContent = 'Lien envoyé ✓';
    } catch(err){
      msg.textContent = "Erreur d'envoi — vérifie l'adresse email et réessaie.";
      msg.classList.add('error');
      btn.disabled = false;
      btn.textContent = 'Recevoir le lien de connexion';
    }
  });

  // ---------- INIT: check session on load ----------
  (async function initAuth(){
    const { data: { session } } = await supabase.auth.getSession();
    if(session && session.user){
      currentUser = session.user;
      await startApp();
    } else {
      showAuthGate();
    }
  })();

  // React to magic-link sign-in happening while the page is already open
  supabase.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_IN' && session && session.user && !currentUser){
      currentUser = session.user;
      startApp();
    }
    if(event === 'SIGNED_OUT'){
      currentUser = null;
      showAuthGate();
    }
  });
})();
</script>
